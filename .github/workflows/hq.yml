name: HQ
on:
  push:
    paths: ["hq/**", "skills/company/**", ".github/workflows/hq.yml"]
  pull_request:
    paths: ["hq/**", "skills/company/**", ".github/workflows/hq.yml"]
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hq
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: hq/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm audit --omit=dev --audit-level=high
