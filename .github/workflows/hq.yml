name: HQ
on:
  push:
    paths: ["hq/**", "skills/company/**", "skills/share/scripts/**", ".github/workflows/hq.yml"]
  pull_request:
    paths: ["hq/**", "skills/company/**", "skills/share/scripts/**", ".github/workflows/hq.yml"]
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hq
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: hq/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: 브라우저 암호화 번들이 원본과 같은지
        run: node scripts/build-vendor.mjs && git diff --exit-code public/js/sealed.js
