# 예시 프로젝트 벌금장부: 테스트 → Cloudflare Workers(무료 등급) 배포
# 필요한 것: 저장소 Secrets 에 CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID (없으면 배포는 건너뜀)
name: Beolgeum
on:
  push:
    branches: [main]
    paths: ["examples/beolgeum-jangbu/**", ".github/workflows/beolgeum.yml"]
  pull_request:
    paths: ["examples/beolgeum-jangbu/**", ".github/workflows/beolgeum.yml"]
  workflow_dispatch:
defaults:
  run:
    working-directory: examples/beolgeum-jangbu
env:
  WRANGLER_SEND_METRICS: "false"
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: examples/beolgeum-jangbu/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm audit --omit=dev --audit-level=high

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency: beolgeum-deploy
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STATS: ${{ secrets.BEOLGEUM_STATS_TOKEN }}
      SUPPORT_URL: ${{ vars.BEOLGEUM_SUPPORT_URL }}   # 후원 링크 (선택, 저장소 Variables)
    steps:
      - name: 준비 확인
        id: pre
        working-directory: .
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID 시크릿이 없어 배포를 건너뜁니다."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.pre.outputs.go == 'true'
        uses: actions/checkout@v4
      - if: steps.pre.outputs.go == 'true'
        uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: examples/beolgeum-jangbu/package-lock.json }
      - if: steps.pre.outputs.go == 'true'
        run: npm ci
      - name: D1 데이터베이스 (없으면 만들기)
        if: steps.pre.outputs.go == 'true'
        run: |
          id=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="beolgeum-jangbu") | .uuid')
          if [ -z "$id" ]; then
            npx wrangler d1 create beolgeum-jangbu --location apac
            id=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="beolgeum-jangbu") | .uuid')
          fi
          sed -i "s/LOCAL_PLACEHOLDER/$id/" wrangler.toml
          npx wrangler d1 migrations apply DB --remote
      - name: 운영 지표 토큰 (선택)
        if: steps.pre.outputs.go == 'true' && env.STATS != ''
        run: echo "$STATS" | npx wrangler secret put STATS_TOKEN
      - name: 배포
        id: deploy
        if: steps.pre.outputs.go == 'true'
        run: |
          extra=(); [ -n "$SUPPORT_URL" ] && extra=(--var "SUPPORT_URL:$SUPPORT_URL")
          npx wrangler deploy "${extra[@]}" | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: 운영 확인 (스모크)
        if: steps.pre.outputs.go == 'true'
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          # 새 버전이 전 세계에 퍼지는 데 잠시 걸린다 — 최대 2분 재시도
          ok=""
          for i in $(seq 1 24); do
            if curl -fsS "$URL/health" | grep -q '"ok":true' && curl -fsS "$URL/" | grep -q '벌금장부' && curl -fsS -o /dev/null "$URL/static/app.css"; then ok=1; break; fi
            sleep 5
          done
          [ -n "$ok" ] || { echo "::error::배포 후 2분 안에 정상 응답이 오지 않았어요"; curl -sS -i "$URL/" | head -20; exit 1; }
          # 핵심 흐름 1회: 모임 만들기 → 멤버 → 회차 → 조회 → 삭제 (테스트 데이터는 바로 지운다)
          g=$(curl -fsS -X POST "$URL/api/groups" -H 'content-type: application/json' -d '{"name":"[배포 확인] 자동 점검","fine_late":1000,"fine_absent":3000,"fine_homework":2000}')
          id=$(echo "$g" | jq -r .id); key=$(echo "$g" | jq -r .adminKey)
          echo "::add-mask::$key"
          m=$(curl -fsS -X POST "$URL/api/groups/$id/members" -H 'content-type: application/json' -H "x-admin-key: $key" -d '{"name":"점검"}' | jq -r .id)
          curl -fsS -X POST "$URL/api/groups/$id/sessions" -H 'content-type: application/json' -H "x-admin-key: $key" -d "{\"date\":\"2026-01-01\",\"entries\":[{\"member_id\":$m,\"status\":\"late\"}]}" >/dev/null
          curl -fsS "$URL/g/$id" | grep -q '1,000'
          curl -fsS -X DELETE "$URL/api/groups/$id" -H "x-admin-key: $key"
          [ "$(curl -s -o /dev/null -w '%{http_code}' "$URL/g/$id")" = 404 ]
          echo "핵심 흐름 확인 완료"
          echo "### 벌금장부 주소: $URL" >> "$GITHUB_STEP_SUMMARY"
          echo "배포 확인: 상태·첫 화면·정적 파일·모임 생성→기록→조회→삭제 모두 정상" >> "$GITHUB_STEP_SUMMARY"
