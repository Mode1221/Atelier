# 예시 프로젝트 벌금장부: 테스트 → Cloudflare Workers(무료 등급) 배포
# 필요한 것: 저장소 Secrets 에 CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID (없으면 배포는 건너뜀)
name: Beolgeum
on:
  push:
    branches: [main]
    paths: ["examples/beolgeum-jangbu/**", ".github/workflows/beolgeum.yml"]
  pull_request:
    paths: ["examples/beolgeum-jangbu/**", ".github/workflows/beolgeum.yml"]
  workflow_dispatch:
defaults:
  run:
    working-directory: examples/beolgeum-jangbu
env:
  WRANGLER_SEND_METRICS: "false"
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: examples/beolgeum-jangbu/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm audit --omit=dev --audit-level=high

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency: beolgeum-deploy
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STATS: ${{ secrets.BEOLGEUM_STATS_TOKEN }}
    steps:
      - name: 준비 확인
        id: pre
        working-directory: .
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID 시크릿이 없어 배포를 건너뜁니다."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.pre.outputs.go == 'true'
        uses: actions/checkout@v4
      - if: steps.pre.outputs.go == 'true'
        uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: examples/beolgeum-jangbu/package-lock.json }
      - if: steps.pre.outputs.go == 'true'
        run: npm ci
      - name: D1 데이터베이스 (없으면 만들기)
        if: steps.pre.outputs.go == 'true'
        run: |
          id=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="beolgeum-jangbu") | .uuid')
          if [ -z "$id" ]; then
            npx wrangler d1 create beolgeum-jangbu --location apac
            id=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="beolgeum-jangbu") | .uuid')
          fi
          sed -i "s/LOCAL_PLACEHOLDER/$id/" wrangler.toml
          npx wrangler d1 migrations apply DB --remote
      - name: 운영 지표 토큰 (선택)
        if: steps.pre.outputs.go == 'true' && env.STATS != ''
        run: echo "$STATS" | npx wrangler secret put STATS_TOKEN
      - name: 배포
        id: deploy
        if: steps.pre.outputs.go == 'true'
        run: |
          npx wrangler deploy | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: 확인
        if: steps.pre.outputs.go == 'true'
        run: |
          url="${{ steps.deploy.outputs.url }}"
          for i in 1 2 3 4 5 6; do curl -fsS "$url/health" && break; sleep 5; done
          curl -fsS "$url/" | grep -q "벌금장부"
          echo "### 벌금장부 주소: $url" >> "$GITHUB_STEP_SUMMARY"
