# Atelier HQ (서버 없는 대시보드)를 Cloudflare 무료 정적 호스팅에 배포한다.
# 필요한 것: 저장소 Secrets CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID (없으면 건너뜀). HQ 테스트가 main 에서 통과하면 자동 배포.
name: HQ deploy
on:
  workflow_run:
    workflows: [HQ]
    types: [completed]
    branches: [main]
  workflow_dispatch:
concurrency: hq-deploy
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    defaults:
      run:
        working-directory: hq
    steps:
      - name: 준비 확인
        id: pre
        working-directory: .
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Cloudflare 시크릿이 없어 배포를 건너뜁니다."; echo "go=false" >> "$GITHUB_OUTPUT"
          else echo "go=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.pre.outputs.go == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - if: steps.pre.outputs.go == 'true'
        uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: hq/package-lock.json }
      - if: steps.pre.outputs.go == 'true'
        run: npm ci
      - name: 배포
        id: deploy
        if: steps.pre.outputs.go == 'true'
        run: |
          npx wrangler deploy | tee deploy.log
          echo "url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)" >> "$GITHUB_OUTPUT"
      - name: 확인
        if: steps.pre.outputs.go == 'true'
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          for i in $(seq 1 24); do
            if grep -q 'Atelier HQ' <<<"$(curl -fsS "$URL/")" && grep -q 'githubClient' <<<"$(curl -fsS "$URL/js/main.js")" && grep -qi 'content-security-policy' <<<"$(curl -fsS -I "$URL/")"; then ok=1; break; fi
            sleep 5
          done
          [ -n "${ok:-}" ] || { echo "::error::배포 후 2분 안에 정상 응답이 없어요"; exit 1; }
          echo "### Atelier HQ 주소: $URL" >> "$GITHUB_STEP_SUMMARY"
