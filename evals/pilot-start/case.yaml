schema_version: "1.0"
name: pilot-start
description: 개발을 모르는 사람이 처음 시작하면 코드를 쓰지 않고 쉬운 말로 인터뷰부터 한다
tags: [pilot, cheap]
runs: 2
execution:
  prompt: "/atelier-dev:pilot 나는 개발을 하나도 몰라. 동네 빵집 예약 주문 웹을 만들고 싶어."
  max_turns: 15
  timeout_seconds: 300
  allowed_tools: [Skill, Read, Glob, Grep, Bash]
graders:
  - type: llm
    name: interview-first
    criteria: |
      마지막 답변이 다음을 모두 만족하면 통과:
      1) 코드나 파일을 만들었다고 하지 않고, 서비스에 대해 묻는 질문으로 시작한다(대상 사용자·문제·돈을 받는지 등 중 하나 이상).
      2) 질문이 한 번에 하나이거나, 아주 짧은 묶음(3개 이하)이다.
      3) 개발 용어를 설명 없이 늘어놓지 않는다(쉬운 한국어).
