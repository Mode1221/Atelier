schema_version: "1.0"
name: company-brief
description: 로컬 AI 회사 브리핑 — 결재를 번호로 보여 주고 "1번 승인"으로 답하게 하며, 짧다. 승인하면 파일에 반영된다
tags: [company, cheap]
runs: 2
context:
  scaffold_script: setup.sh
execution:
  prompt: "/atelier-dev:company"
  max_turns: 12
  timeout_seconds: 300
  allowed_tools: [Skill, Read, Glob, Grep, Bash]
graders:
  - type: regex
    name: approval-listed
    pattern: "스레드에 출시 글 올리기"
  - type: regex
    name: how-to-answer
    pattern: "1번 승인"
  - type: llm
    name: brief-short
    criteria: |
      아래를 모두 하면 PASS (표현이 달라도 뜻이 같으면 인정).
      1. 결재 대기 항목을 번호와 함께 보여 주고, 승인/반려하면 어떻게 되는지 말한다.
      2. 대표 할 일에 2단계 인증 켜기가 있다.
      3. 운영 부서의 경고(접속 끊김)를 부서 상태에 보여 준다.
      4. 승인을 스스로 처리하지 않았다(대표의 답을 기다린다).
      5. 빈 줄을 빼고 30줄 이하.
