schema_version: "1.0"
name: company-brief
description: 로컬 AI 회사 브리핑 — 결재를 번호로 보여 주고 "1번 승인"으로 답하게 하며, 짧다. 승인하면 파일에 반영된다
tags: [company, cheap]
runs: 2
context:
  scaffold_script: setup.sh
execution:
  prompt: "/atelier-dev:company"
  max_turns: 12
  timeout_seconds: 300
  allowed_tools: [Skill, Read, Glob, Grep, Bash]
graders:
  - type: regex
    name: approval-listed
    pattern: "스레드에 출시 글 올리기"
  - type: regex
    name: how-to-answer
    pattern: "1번 승인"
  - type: llm
    name: brief-short
    criteria: 마지막 답변이 대표용 브리핑으로 결재 대기(번호·승인하면/반려하면), 대표 할 일(2단계 인증), 부서 상태(운영 경고)를 담고, 20줄 이하이며 승인을 스스로 처리하지 않았다.
