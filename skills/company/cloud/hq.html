<title>Atelier 본부</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* 본부 = 여러 서비스를 한 화면에서 운영. 첫 화면은 "전체"(서비스 카드 + 모든 서비스의 할 일함), 서비스를 누르면 한 페이지 상세. */
:root{
  --bg:#f5f7fa;--surface:#ffffff;--sunk:#eef2f7;--ink:#1e2233;--ink-2:#454b60;--muted:#5f6679;--line:#e3e8ef;
  --accent:#0a6fc4;--on-accent:#ffffff;
  --side-bg:#23263a;--side-ink:#e9ebf3;--side-muted:#a9afc2;--side-hover:#2f3349;
  --good:#17703d;--warn:#8a5800;--crit:#b3302a;--good-bg:#e6f6ec;--warn-bg:#fff4dc;--crit-bg:#fde8e6;
  --font:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;--r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12151d;--surface:#1b1f2b;--sunk:#242938;--ink:#eceef5;--ink-2:#c5c9d6;--muted:#a3a9bb;--line:#2e3445;
  --accent:#5aadff;--on-accent:#06111f;
  --side-bg:#0d1017;--side-ink:#e9ebf3;--side-muted:#9aa1b5;--side-hover:#1c2130;
  --good:#7fd08f;--warn:#f0bf5a;--crit:#ff8a80;--good-bg:#1d3324;--warn-bg:#3a2f16;--crit-bg:#3d1f1c;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151d;--surface:#1b1f2b;--sunk:#242938;--ink:#eceef5;--ink-2:#c5c9d6;--muted:#a3a9bb;--line:#2e3445;
  --accent:#5aadff;--on-accent:#06111f;
  --side-bg:#0d1017;--side-ink:#e9ebf3;--side-muted:#9aa1b5;--side-hover:#1c2130;
  --good:#7fd08f;--warn:#f0bf5a;--crit:#ff8a80;--good-bg:#1d3324;--warn-bg:#3a2f16;--crit-bg:#3d1f1c;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--font);margin:0}
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{background:var(--side-bg);color:var(--side-ink);padding:16px 12px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.side-head{margin:0;padding:4px 10px 10px;font-weight:700;font-size:15px}
.side-note{margin:auto 10px 0;color:var(--side-muted);font-size:12px}
.wrap{min-width:0;max-width:1040px;width:100%;padding:16px 24px 56px}
@media (max-width:759px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:8px 12px;gap:6px}
  .side-head,.side-note{display:none}
  .wrap{padding-inline:16px}
}
h1,h2,h3{text-wrap:balance;margin:0}
h1{font-size:22px}h2{font-size:17px}h3{font-size:15px}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.side :focus-visible{outline-color:var(--side-ink)}
/* 서비스 목록 */
.nav-btn{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;min-height:44px;padding:8px 10px;border:0;border-radius:8px;background:transparent;color:var(--side-ink);font:inherit;text-align:left;cursor:pointer;width:100%;flex:none}
@media (max-width:759px){.nav-btn{width:auto;white-space:nowrap}}
.nav-btn:hover{background:var(--side-hover)}
.nav-btn[aria-current="page"]{background:var(--accent);color:var(--on-accent)}
.nav-btn .n{min-width:22px;padding:0 6px;border-radius:10px;background:#ff8a80;color:#23120f;font:600 12px/20px var(--mono);text-align:center}
.nav-btn[aria-current="page"] .n{background:var(--on-accent);color:var(--accent)}
.nav-btn .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted);display:inline-block;flex:none}
.dot.good{background:var(--good)}.dot.warning{background:var(--warn)}.dot.critical{background:var(--crit)}
.side .dot{background:var(--side-muted)}.side .dot.good{background:#6fdc8c}.side .dot.warning{background:#f5c451}.side .dot.critical{background:#ff8a80}
.nav-btn .dot.all{background:transparent;border:2px solid currentColor;width:10px;height:10px}
/* 공통 */
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.head p{margin:2px 0 0}
.banner{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;padding:14px 16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);margin-bottom:20px}
.banner strong{font-size:16px}
.banner[data-level="good"]{background:var(--good-bg);border-color:transparent}
.banner[data-level="warning"]{background:var(--warn-bg);border-color:transparent}
.banner[data-level="critical"]{background:var(--crit-bg);border-color:transparent}
.sec{display:grid;gap:10px;margin-bottom:28px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.grid{display:grid;gap:12px}
@media (min-width:760px){.grid.two{grid-template-columns:1fr 1fr}.grid.three{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0;display:grid;gap:10px;align-content:start}
.muted{color:var(--muted)}.small{font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:600;background:var(--sunk);color:var(--ink-2);white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)}.pill.warning{background:var(--warn-bg);color:var(--warn)}.pill.critical{background:var(--crit-bg);color:var(--crit)}
button,.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:500;cursor:pointer;text-decoration:none}
button.primary,.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
button.danger{color:var(--crit);border-color:var(--crit)}
button.link{border:0;background:none;padding:0 4px;min-height:44px;color:var(--accent);text-decoration:underline}
button:disabled{opacity:.55;cursor:not-allowed}
label{display:grid;gap:4px;font-weight:500;font-size:14px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:44px;width:100%}
textarea{min-height:80px}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:400}
.check input{width:22px;height:22px;min-height:0;margin-top:2px;accent-color:var(--accent);flex:none}
.empty{color:var(--muted);padding:14px;border:1px dashed var(--line);border-radius:8px;margin:0}
.note{font-size:13px;color:var(--muted);margin:0}
/* 서비스 카드 (전체 화면) */
.svc-card{cursor:pointer}
.svc-card:hover{border-color:var(--accent)}
.svc-card .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.nums div{background:var(--sunk);border-radius:8px;padding:8px 10px;min-width:0}
.nums b{display:block;font:600 19px/1.3 var(--mono);font-variant-numeric:tabular-nums}
.nums span{display:block;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.kv div{background:var(--sunk);border-radius:8px;padding:10px 12px}
.kv b{display:block;font:600 20px/1.3 var(--mono);font-variant-numeric:tabular-nums}
/* 할 일함 */
.inbox{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.inbox>li{background:var(--surface);border:1px solid var(--line);border-left-width:4px;border-radius:var(--r);padding:12px 14px;display:grid;gap:8px}
.inbox>li[data-kind="report"]{border-left-color:var(--crit)}
.inbox>li[data-kind="approval"]{border-left-color:var(--warn)}
.inbox>li[data-kind="human"]{border-left-color:var(--accent)}
.inbox>li[data-kind="voice"]{border-left-color:var(--line)}
.inbox .what{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.inbox .svc-tag{font-size:13px;font-weight:600;color:var(--ink-2);background:var(--sunk);padding:0 8px;border-radius:6px;min-height:28px;text-decoration:none}
.inbox p{margin:0}
.goal{display:grid;gap:6px}
progress{width:100%;height:8px;accent-color:var(--accent)}
.focus{font-size:16px;font-weight:700;margin:0}
code{overflow-wrap:anywhere}
pre.post{white-space:pre-wrap;word-break:break-all;margin:0;font:inherit;background:var(--sunk);border-radius:8px;padding:12px}
ul.plain{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.item{padding:8px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
details.more{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:0 16px}
details.more>summary{cursor:pointer;min-height:48px;display:flex;align-items:center;font-weight:600}
details.more[open]>summary{border-bottom:1px solid var(--line);margin-bottom:12px}
details.more>div{padding-bottom:16px;display:grid;gap:16px}
.flash{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;max-width:calc(100% - 32px);z-index:5}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
</style>

<div class="shell">
  <aside class="side" aria-label="서비스">
    <p class="side-head">Atelier 본부</p>
    <nav id="nav" aria-label="서비스 목록"></nav>
    <p class="side-note">새 서비스는 Claude 에게 "이 서비스를 본부에 추가해 줘"라고 말하면 생겨요.</p>
  </aside>
  <main class="wrap" id="view" tabindex="-1"></main>
</div>
<div class="flash" id="flash" role="status" aria-live="polite" hidden></div>

<script>
// ---- 회사 도메인 (Atelier company 스킬과 같은 부서 목록)
const DEPTS = [
  { id: 'ceo', name: '대표실', role: '하루 계획과 주간 보고' },
  { id: 'plan', name: '기획', role: '무엇을 만들지 정하고 명세' },
  { id: 'design', name: '디자인', role: '화면·이미지·아이콘' },
  { id: 'dev', name: '개발', role: '기능 구현·배포 준비' },
  { id: 'qa', name: 'QA', role: '품질 검사·사용성 테스트' },
  { id: 'security', name: '보안·법무', role: '보안 점검·약관' },
  { id: 'marketing', name: '마케팅', role: '홍보 글·채널 성과' },
  { id: 'support', name: '고객지원', role: '사용자 의견 정리·답변' },
  { id: 'ops', name: '운영', role: '서비스 상태·장애 대응' },
  { id: 'data', name: '데이터·재무', role: '지표·비용 보고' },
];
const DEPT = Object.fromEntries(DEPTS.map((d) => [d.id, d]));
const KIND = { good: '좋아요', hard: '불편해요', bug: '오류', idea: '제안' };
const STAGE = { pilot: '시작', idea: '아이디어', spec: '명세', design: '디자인', build: '만드는 중', guard: '점검', launch: '출시 준비', operate: '운영 중', grow: '키우는 중' };
const stageOf = (st) => STAGE[st] ?? st;
const LEVEL = { good: '정상', warning: '확인 필요', critical: '문제', idle: '보고 없음' };
const REMOTE = 'Claude Code Remote';

// SNS 공식 공유 창 (Atelier share 스킬 channels.mjs 와 같은 규칙)
const enc = encodeURIComponent;
const CHANNELS = {
  x: { name: 'X (트위터)', intent: (t, u) => `https://x.com/intent/post?text=${enc(t)}&url=${enc(u)}` },
  threads: { name: 'Threads', linkInComment: true, intent: (t) => `https://www.threads.net/intent/post?text=${enc(t)}` },
  bluesky: { name: 'Bluesky', intent: (t, u) => `https://bsky.app/intent/compose?text=${enc(t + '\n' + u)}` },
  facebook: { name: 'Facebook', intent: (_t, u) => `https://www.facebook.com/sharer/sharer.php?u=${enc(u)}`, note: '글은 복사해서 붙여 넣어요' },
  linkedin: { name: 'LinkedIn', intent: (_t, u) => `https://www.linkedin.com/sharing/share-offsite/?url=${enc(u)}`, note: '글은 복사해서 붙여 넣어요' },
  reddit: { name: 'Reddit', intent: (t, u) => `https://www.reddit.com/submit?url=${enc(u)}&title=${enc(t.split('\n')[0])}`, note: '게시판 규칙 먼저 확인' },
  band: { name: '네이버 밴드', intent: (t, u) => `https://band.us/plugin/share?body=${enc(t + '\n' + u)}&route=${enc(u)}` },
  naver_blog: { name: '네이버 블로그', intent: (t, u) => `https://share.naver.com/web/shareView?url=${enc(u)}&title=${enc(t.split('\n')[0])}` },
  kakaotalk: { name: '카카오톡', note: '복사해서 단톡·오픈채팅에 붙여 넣어요 (방 규칙 확인)' },
  everytime: { name: '에브리타임', note: '복사해서 홍보 게시판에 붙여 넣어요' },
  discord: { name: 'Discord', note: '복사해서 홍보 허용 채널에' },
  instagram: { name: 'Instagram', note: '링크는 프로필에, 이미지와 함께' },
  naver_cafe: { name: '네이버 카페', note: '복사해서 카페 홍보 게시판에 (카페 규칙 양식 확인)' },
  daangn: { name: '당근 동네생활', note: '복사해서 동네생활에 (노골적 광고는 신고돼요)' },
  disquiet: { name: '디스콰이엇', note: '복사해서 메이커 로그에' },
};
const channelId = (c) => {
  if (CHANNELS[c]) return c;
  const k = String(c ?? '').toLowerCase().replace(/\s|\(.*\)/g, '');
  const alias = { threads: 'threads', 스레드: 'threads', x: 'x', 트위터: 'x', twitter: 'x', 인스타그램: 'instagram', instagram: 'instagram', 에브리타임: 'everytime', 카카오톡: 'kakaotalk', 오픈채팅: 'kakaotalk', 디스콰이엇: 'disquiet', 밴드: 'band', 네이버밴드: 'band', 네이버블로그: 'naver_blog', 블로그: 'naver_blog', 네이버카페: 'naver_cafe', 당근: 'daangn', 당근동네생활: 'daangn', 페이스북: 'facebook', facebook: 'facebook', 링크드인: 'linkedin', reddit: 'reddit', 레딧: 'reddit', 블루스카이: 'bluesky', bluesky: 'bluesky', 디스코드: 'discord' };
  return alias[k] ?? c;
};
const stripLink = (t, url) => { try { const h = new URL(url).host; return String(t).replace(new RegExp(`\\s*(https?://)?${h.replace(/\./g, '\\.')}\\S*\\s*$`), ''); } catch { return t; } };
const withUtm = (url, source, campaign) => {
  try {
    const u = new URL(url);
    u.searchParams.set('utm_source', source);
    u.searchParams.set('utm_medium', 'social');
    if (campaign) u.searchParams.set('utm_campaign', campaign);
    return u.href;
  } catch { return url; }
};

// ---- 상태: 서비스마다 운영에 필요한 것만 구독한다. 상세 화면을 열면 로드맵·홍보·부서 일을 더 구독한다.
const S = { services: [], svc: {}, loaded: false, routines: null, routinesErr: null };
const blank = () => ({ approvals: [], human: [], reports: {}, metrics: null, feedback: [], plan: null, posts: null, shared: new Set(), tasks: [], extra: false });
let db = null, mcp = null, canWrite = true;
let view = parseHash();
const subs = {}; // 서비스 id → 구독 해제 함수들

const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const ago = (iso) => {
  if (!iso) return '기록 없음';
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  if (s < 90) return '방금';
  if (s < 3600) return `${Math.round(s / 60)}분 전`;
  if (s < 86400) return `${Math.round(s / 3600)}시간 전`;
  return `${Math.round(s / 86400)}일 전`;
};
const pill = (level, text) => `<span class="pill ${esc(level)}">${esc(text ?? LEVEL[level] ?? level)}</span>`;
const nameOf = (id) => S.services.find((v) => v.id === id)?.name ?? id;
function flash(msg) {
  const f = $('#flash');
  f.textContent = msg;
  f.hidden = false;
  clearTimeout(flash.t);
  flash.t = setTimeout(() => (f.hidden = true), 3200);
}
function parseHash() {
  const h = decodeURIComponent(location.hash.slice(1));
  return h.startsWith('s=') ? { svc: h.slice(2) } : { svc: null };
}
function go(svc) {
  view = { svc };
  try { history.replaceState(null, '', svc ? `#s=${encodeURIComponent(svc)}` : '#'); } catch {}
  if (svc) loadExtra(svc);
  render(true);
  $('#view').focus({ preventScroll: true });
  scrollTo(0, 0);
}

// 사람이 읽는 일정 (CRON_TZ=Asia/Seoul 분 시 * * 요일)
function schedule(cron) {
  const m = /^(?:CRON_TZ=\S+\s+)?(\d+)\s+(\d+)\s+\*\s+\*\s+(\S+)$/.exec(cron ?? '');
  if (!m) return cron ? '정해진 일정' : '일정 없음';
  const t = `${m[2].padStart(2, '0')}:${m[1].padStart(2, '0')}`;
  const d = { '*': '매일', '1-5': '평일' }[m[3]] ?? m[3].split(',').map((x) => '일월화수목금토'[Number(x) % 7] ?? x).join('·');
  return `${d} ${t}`;
}

// ---- 할 일함: 대표가 봐야 하는 것만, 중요한 순서로 (문제 보고 → 결재 → 대표 할 일 → 새 의견)
function inboxOf(id) {
  const d = S.svc[id];
  if (!d) return [];
  const out = [];
  for (const dep of DEPTS) {
    const r = d.reports[dep.id];
    if (r?.level === 'critical') out.push({ kind: 'report', svc: id, key: `r-${id}-${dep.id}`, title: `${dep.name} 부서가 문제를 보고했어요`, text: r.summary, at: r.at });
  }
  for (const a of d.approvals.filter((x) => x.status === 'pending')) out.push({ kind: 'approval', svc: id, key: `a-${id}-${a.id}`, a, title: a.title, at: a.createdAt });
  for (const h of d.human.filter((x) => !x.done)) out.push({ kind: 'human', svc: id, key: `h-${id}-${h.id}`, h, title: h.text, at: h.createdAt });
  const fresh = d.feedback.filter((f) => f.status !== 'triaged');
  const n = fresh.reduce((s, f) => s + (f.count ?? f.items?.length ?? 0), 0);
  if (fresh.length) out.push({ kind: 'voice', svc: id, key: `v-${id}`, title: `정리 전 사용자 의견 ${n}건`, text: '고객지원 부서가 다음 실행 때 분류해요. 급하면 내용을 먼저 보세요.', at: fresh[0].date });
  return out;
}
const ORDER = { report: 0, approval: 1, human: 2, voice: 3 };
const inboxAll = () => S.services.flatMap((v) => inboxOf(v.id)).sort((x, y) => ORDER[x.kind] - ORDER[y.kind] || String(y.at ?? '').localeCompare(String(x.at ?? '')));

// 서비스 상태: 문제 보고 > 결재·할 일 > 경고 보고 > 정상
function levelOf(id) {
  const d = S.svc[id];
  if (!d) return 'idle';
  const lv = Object.values(d.reports).map((r) => r.level);
  if (lv.includes('critical')) return 'critical';
  if (lv.includes('warning') || inboxOf(id).some((x) => x.kind === 'approval' || x.kind === 'human')) return 'warning';
  return lv.length ? 'good' : 'idle';
}
const countOf = (id) => inboxOf(id).filter((x) => x.kind !== 'voice').length;

function inboxItem(it, showSvc) {
  const tag = showSvc ? `<button class="svc-tag link" data-go="${esc(it.svc)}" aria-label="${esc(nameOf(it.svc))} 상세 보기">${esc(nameOf(it.svc))}</button>` : '';
  const label = { report: pill('critical', '문제'), approval: pill('warning', '결재'), human: pill('', '대표 할 일'), voice: pill('', '새 의견') }[it.kind];
  let body = '';
  if (it.kind === 'approval') {
    const a = it.a;
    body = `<p class="small muted">${esc(DEPT[a.dept]?.name ?? a.dept)}${a.kind && !(a.cost && a.kind === '비용') ? ` · ${esc(a.kind)}` : ''}${a.cost ? ` · 비용 ${esc(a.cost)}` : ''} · ${ago(a.createdAt)}</p>
      ${a.detail ? `<p>${esc(a.detail)}</p>` : ''}
      ${a.ifApprove ? `<p class="small"><b>승인하면</b> ${esc(a.ifApprove)}</p>` : ''}
      ${a.ifReject ? `<p class="small"><b>반려하면</b> ${esc(a.ifReject)}</p>` : ''}
      ${canWrite ? `<div class="row"><button class="primary" data-act="approve" data-svc="${esc(it.svc)}" data-id="${esc(a.id)}" aria-label="승인: ${esc(a.title)}">승인</button>
        <details data-k="rej-${esc(it.svc)}-${esc(a.id)}"><summary class="small">반려하기</summary><form data-act="reject" data-k="rejf-${esc(it.svc)}-${esc(a.id)}" data-svc="${esc(it.svc)}" data-id="${esc(a.id)}" class="grid">
          <label>반려 이유 (부서가 보고 고쳐요)<textarea name="reason" required maxlength="500"></textarea></label>
          <button class="danger">반려</button></form></details></div>` : ''}`;
  } else if (it.kind === 'human') {
    const h = it.h;
    body = `${h.why ? `<p class="small muted">${esc(h.why)}</p>` : ''}
      <div class="row">${h.link && /^https?:/.test(h.link) ? `<a class="btn" href="${esc(h.link)}" target="_blank" rel="noopener">열기 ↗</a>` : h.link ? `<span class="small muted">${esc(h.link)}</span>` : ''}
      ${canWrite ? `<button data-act="human" data-svc="${esc(it.svc)}" data-id="${esc(h.id)}" aria-label="했어요: ${esc(h.text)}">했어요</button>` : ''}</div>`;
  } else if (it.kind === 'voice') {
    body = `<p class="small muted">${esc(it.text)}</p><div class="row"><button data-go="${esc(it.svc)}" data-anchor="voice">의견 보기</button></div>`;
  } else {
    body = `<p>${esc(it.text)}</p><p class="small muted">${ago(it.at)}</p>`;
  }
  return `<li data-kind="${it.kind}"><div class="what">${label}${tag}<b>${esc(it.title)}</b></div>${body}</li>`;
}

// ---- 화면
// 실시간 갱신으로 다시 그려도 펼친 칸·쓰던 글·커서 위치는 그대로 둔다 (반려 이유를 쓰는 중에 보고가 와도 안 날아가게).
const fieldKey = (el) => { const k = el.closest('[data-k]')?.dataset.k; return k && el.name ? `${k}/${el.name}` : null; };
function keepUi(root) {
  const open = new Set([...root.querySelectorAll('details[open][data-k]')].map((x) => x.dataset.k));
  const vals = new Map([...root.querySelectorAll('input,textarea,select')].map((el) => [fieldKey(el), el.type === 'checkbox' ? el.checked : el.value]).filter(([k]) => k));
  const a = document.activeElement;
  const focus = root.contains(a) && fieldKey(a) ? { k: fieldKey(a), s: a.selectionStart, e: a.selectionEnd } : null;
  return { open, vals, focus };
}
function restoreUi(root, { open, vals, focus }) {
  root.querySelectorAll('details[data-k]').forEach((x) => { if (open.has(x.dataset.k)) x.open = true; });
  root.querySelectorAll('input,textarea,select').forEach((el) => {
    const k = fieldKey(el);
    if (!k || !vals.has(k)) return;
    if (el.type === 'checkbox') el.checked = vals.get(k); else el.value = vals.get(k);
    if (focus?.k === k) { el.focus({ preventScroll: true }); try { el.setSelectionRange(focus.s, focus.e); } catch {} }
  });
}
function render(fresh = false) {
  renderNav();
  const main = $('#view');
  const ui = fresh ? null : keepUi(main);
  main.innerHTML = view.svc && S.services.some((v) => v.id === view.svc) ? detail(view.svc) : overview();
  if (ui) restoreUi(main, ui);
}

function renderNav() {
  const total = inboxAll().filter((x) => x.kind !== 'voice').length;
  const btn = (id, label, dot, n) => `<button class="nav-btn" data-go="${esc(id ?? '')}" ${(view.svc ?? '') === (id ?? '') ? 'aria-current="page"' : ''}>
    <span class="dot ${dot}" aria-hidden="true"></span><span class="nm">${esc(label)}</span>${n ? `<span class="n" aria-label="확인할 것 ${n}건">${n}</span>` : '<span></span>'}</button>`;
  $('#nav').innerHTML = btn(null, '전체', 'all', total) + S.services.map((v) => btn(v.id, v.name ?? v.id, levelOf(v.id), countOf(v.id))).join('');
}

function banner(level, title, text) {
  return `<div class="banner" data-level="${level}" role="status"><strong>${esc(title)}</strong>${text ? `<span class="muted">${esc(text)}</span>` : ''}</div>`;
}

function overview() {
  if (!S.loaded) return `<div class="head"><h1>전체 서비스</h1></div>${banner('idle', '불러오는 중', '')}`;
  if (!db) return `<div class="head"><h1>전체 서비스</h1></div>${banner('idle', 'claude.ai 에서 열어 주세요', '로그인한 상태에서만 본부 정보를 볼 수 있어요.')}`;
  if (!S.services.length) return `<div class="head"><h1>전체 서비스</h1></div>${banner('idle', '아직 등록된 서비스가 없어요', 'Claude 에게 "Atelier 로 이 서비스를 본부에 추가해 줘"라고 말하면 여기에 생겨요.')}`;

    : act.length ? banner('warning', `확인할 것 ${act.length}건`, `서비스 ${S.services.length}개 중 ${new Set(act.map((x) => x.svc)).size}개에서 대표님을 기다려요.`)
    : banner('good', '모든 서비스 이상 없음', `서비스 ${S.services.length}개 — 대표님이 확인할 것이 없어요.`);
  return `<div class="head"><div><h1>전체 서비스</h1><p class="small muted">서비스 ${S.services.length}개 · AI 부서가 일하고 대표님은 확인만 해요</p></div></div>
  ${b}
  <section class="sec" aria-labelledby="h-inbox"><div class="sec-head"><h2 id="h-inbox">할 일함 <span class="muted small">모든 서비스</span></h2></div>
    ${items.length ? `<ul class="inbox">${items.map((it) => inboxItem(it, true)).join('')}</ul>` : '<p class="empty">확인할 것이 없어요. 결재·대표 할 일·문제 보고가 생기면 서비스 이름과 함께 여기에 모여요.</p>'}</section>
  <section class="sec" aria-labelledby="h-svcs"><h2 id="h-svcs">서비스</h2>
    <div class="grid three">${S.services.map(svcCard).join('')}</div></section>`;
}

function svcCard(v) {
  const d = S.svc[v.id] ?? blank();
  const lv = levelOf(v.id);
  const nums = Object.entries(d.metrics?.items ?? {}).slice(0, 3);
  const n = countOf(v.id);
  const last = Object.values(d.reports).map((r) => r.at).sort().pop();
  return `<article class="card svc-card" data-go="${esc(v.id)}">
    <div class="top"><h3><button class="link" data-go="${esc(v.id)}" style="padding:0;font-weight:700;color:var(--ink);text-decoration:none">${esc(v.name ?? v.id)}</button></h3>${pill(lv, n ? `확인 ${n}건` : LEVEL[lv])}</div>
    <p class="small muted" style="margin:0">${esc(v.stage ? stageOf(v.stage) : v.summary ?? '')}</p>
    ${nums.length ? `<div class="nums">${nums.map(([k, val]) => `<div><b>${esc(val)}</b><span title="${esc(k)}">${esc(k)}</span></div>`).join('')}</div>` : '<p class="note">숫자 없음 — 서비스에 지표를 연결하면 나와요</p>'}
    <div class="row small muted"><span>마지막 보고 ${ago(last)}</span>${v.url ? `<a href="${esc(v.url)}" target="_blank" rel="noopener" data-noop>서비스 열기 ↗</a>` : ''}</div>
  </article>`;
}

const STATUS = { now: '이번 주', next: '다음', later: '나중', done: '끝남' };
function goalCard(g) {
  const has = typeof g.current === 'number' && typeof g.target === 'number' && g.target > 0;
  return `<div class="goal"><div class="sec-head"><b>${esc(g.text)}</b>${g.due ? `<span class="small muted">${esc(g.due)}까지</span>` : ''}</div>
    ${has ? `<progress max="${esc(g.target)}" value="${esc(Math.min(g.current, g.target))}" aria-label="${esc(g.text)} ${esc(g.current)}/${esc(g.target)}"></progress><span class="small muted">${esc(g.metric ?? '')} ${esc(g.current)} / ${esc(g.target)}${esc(g.unit ?? '')}</span>`
      : `<span class="small muted">${esc(g.metric ?? '')} 목표 ${esc(g.target ?? '')}${esc(g.unit ?? '')} · 아직 측정 안 됨</span>`}</div>`;
}

function detail(id) {
  const v = S.services.find((x) => x.id === id);
  const d = S.svc[id] ?? blank();
  const items = inboxOf(id);
  const lv = levelOf(id);
  const reps = DEPTS.filter((x) => d.reports[x.id]);
  const m = Object.entries(d.metrics?.items ?? {});
  const p = d.plan;
  const posts = d.posts?.posts ?? [];
  const unposted = posts.map((x, i) => ({ x, i })).filter(({ x, i }) => !d.shared.has(`${x.channel}__${i}`));
  const b = lv === 'critical' ? banner('critical', '문제 보고가 있어요', '아래 할 일함 맨 위를 먼저 봐 주세요.')
    : items.filter((x) => x.kind !== 'voice').length ? banner('warning', `확인할 것 ${items.filter((x) => x.kind !== 'voice').length}건`, '')
    : lv === 'idle' ? banner('idle', '아직 부서 보고가 없어요', '부서가 처음 일하면 여기에 오늘 상태가 나와요.')
    : banner('good', '이상 없음', '확인할 것이 없어요.');
  return `<div class="head"><div><p class="small"><button class="link" data-go="" style="padding:0">← 전체 서비스</button></p><h1>${esc(v.name ?? id)}</h1><p class="small muted">${esc(v.stage ? `지금 단계: ${stageOf(v.stage)}` : v.summary ?? '')}</p></div>
    ${v.url ? `<a class="btn" href="${esc(v.url)}" target="_blank" rel="noopener">서비스 열기 ↗</a>` : ''}</div>
  ${b}
  <section class="sec" aria-labelledby="h-in"><h2 id="h-in">할 일함</h2>
    ${items.length ? `<ul class="inbox">${items.map((it) => inboxItem(it, false)).join('')}</ul>` : '<p class="empty">확인할 것이 없어요.</p>'}</section>
  ${p ? `<section class="sec" aria-labelledby="h-goal"><h2 id="h-goal">이번 목표</h2>
    <div class="card">${p.focus ? `<p class="focus">${esc(p.focus)}</p>` : ''}<div class="grid two">${(p.goals ?? []).slice(0, 4).map(goalCard).join('')}</div>
    ${(p.items ?? []).length ? `<details data-k="road-${esc(id)}"><summary class="small">로드맵 전체 (${p.items.length}개)</summary><ul class="plain">${['now', 'next', 'later', 'done'].flatMap((st) => (p.items ?? []).filter((i) => (i.status ?? 'later') === st).map((i) => `<li class="item small">${pill(st === 'now' ? 'warning' : st === 'done' ? 'good' : '', STATUS[st])} ${esc(i.title)} <span class="muted">· ${esc(i.dept === 'human' ? '대표님' : DEPT[i.dept]?.name ?? i.dept ?? '')}</span></li>`)).join('')}</ul></details>` : ''}
    <p class="note">${p.stage ? `${esc(stageOf(p.stage))} · ` : ''}${ago(p.updatedAt)} 갱신${p.reviewAt ? ` · 다음 재검토 ${esc(p.reviewAt)}` : ''}</p></div></section>` : ''}
  <section class="sec" aria-labelledby="h-num"><div class="sec-head"><h2 id="h-num">숫자</h2>${d.metrics?.at ? `<span class="small muted">${ago(d.metrics.at)} 기준</span>` : ''}</div>
    ${m.length ? `<div class="kv">${m.map(([k, val]) => `<div><span class="small muted">${esc(k)}</span><b>${esc(val)}</b></div>`).join('')}</div>` : '<p class="empty">아직 숫자가 없어요. 데이터·재무 부서나 서비스 지표가 연결되면 나와요.</p>'}</section>
  <section class="sec" aria-labelledby="h-rep"><h2 id="h-rep">부서 보고</h2>

  <section class="sec" aria-labelledby="h-voice" id="voice"><h2 id="h-voice">사용자 의견</h2>${voiceList(d)}</section>
  ${posts.length ? `<section class="sec" aria-labelledby="h-share"><div class="sec-head"><h2 id="h-share">홍보 글</h2><span class="small muted">${posts.length - unposted.length}/${posts.length} 올림</span></div>
    <p class="note">"○○에 올리기"를 누르면 글이 채워진 창이 열려요. 올린 뒤 "올렸어요"를 눌러 주세요. 자동 게시는 하지 않아요.</p>

  <details class="more" data-k="more-${esc(id)}"><summary>더 보기 — 일 맡기기 · 진행 중인 부서 일 · 부서 켜기·끄기</summary><div>
    ${canWrite ? `<form class="grid" data-act="task" data-k="task-${esc(id)}" data-svc="${esc(id)}"><h3>부서에 일 맡기기</h3>

      <label>누구에게<select name="dept">${DEPTS.filter((x) => x.id !== 'ceo').map((x) => `<option value="${x.id}">${esc(x.name)} — ${esc(x.role)}</option>`).join('')}</select></label>

      <button class="primary">맡기기</button></form>` : ''}
    <div><h3>진행 중인 부서 일</h3>${taskList(d)}</div>
    <div>${deptPanel(v)}</div>
  </div></details>`;
}

function voiceList(d) {
  const days = d.feedback.slice(0, 7);
  if (!days.length) return '<p class="empty">아직 들어온 의견이 없어요. 서비스의 "의견 보내기"로 들어온 의견을 고객지원 부서가 매일 정리해요.</p>';
  return `<div class="card"><ul class="plain">${days.map((f) => `<li class="item"><div class="row"><b>${esc(f.date ?? f.id)}</b>${f.status === 'triaged' ? pill('good', '정리됨') : pill('warning', '새 의견')}<span class="small muted">${esc(f.count ?? f.items?.length ?? 0)}건</span></div>
    ${f.summary ? `<p style="margin:4px 0">${esc(f.summary)}</p>` : ''}
    <ul class="plain small">${(f.items ?? []).slice(0, 8).map((it) => `<li>${pill(it.kind === 'bug' ? 'critical' : it.kind === 'hard' ? 'warning' : it.kind === 'good' ? 'good' : '', KIND[it.kind] ?? it.kind)} ${esc(it.message || '(내용 없음)')}${it.action ? ` <span class="muted">→ ${esc(it.action)}</span>` : ''}</li>`).join('')}</ul></li>`).join('')}</ul></div>`;
}

function taskList(d) {
  const open = d.tasks.filter((t) => (t.status ?? 'todo') !== 'done').slice(0, 20);
  if (!d.extra) return '<p class="note">불러오는 중…</p>';
  if (!open.length) return '<p class="note">진행 중인 일이 없어요.</p>';
  const st = { todo: '대기', doing: '진행 중', review: '검토 중' };
  return `<ul class="plain">${open.map((t) => `<li class="item small">${pill(t.status === 'doing' ? 'warning' : '', st[t.status] ?? '대기')} <b>${esc(t.title)}</b> <span class="muted">· ${esc(DEPT[t.dept]?.name ?? t.dept)} · ${ago(t.updatedAt ?? t.createdAt)}</span></li>`).join('')}</ul>`;
}

function deptPanel(v) {
  const map = v.routines ?? {};
  if (!Object.keys(map).length) return '<h3>부서 켜기·끄기</h3><p class="note">이 서비스에는 예약된 부서가 없어요 (로컬 모드이거나 아직 세우지 않음).</p>';
  let head = '';
  if (!mcp) head = '<p class="note">claude.ai 에서 열면 부서를 켜고 끌 수 있어요.</p>';
  else if (S.routinesErr) head = `<p class="note">${esc(S.routinesErr)}</p>`;
  else if (!S.routines) head = '<p class="note">부서 일정을 불러오는 중…</p>';
  const rows = DEPTS.filter((x) => map[x.id]).map((x) => {
    const r = (S.routines ?? []).find((t) => t.id === map[x.id]);
    const last = r?.last_run;
    const lastTxt = last ? `${ago(last.fired_at)} ${last.status?.includes('SUCCEEDED') ? '끝냄' : last.status?.includes('FAIL') ? '실패' : '진행'}` : '아직 안 함';
    return `<li class="item"><div class="row"><b>${esc(x.name)}</b>${r ? pill(r.enabled ? 'good' : '', r.enabled ? '켜짐' : '꺼짐') : ''}<span class="small muted">${r ? `${esc(schedule(r.cron_expression))} · 마지막 ${esc(lastTxt)}` : ''}</span></div>
      ${r && canWrite ? `<div class="row"><button data-act="toggle" data-svc="${esc(v.id)}" data-dept="${x.id}" data-on="${r.enabled ? '1' : '0'}">${r.enabled ? '끄기' : '켜기'}</button><button data-act="run" data-svc="${esc(v.id)}" data-dept="${x.id}">지금 일하기</button></div>` : ''}</li>`;
  }).join('');
  return `<div class="sec-head"><h3>부서 켜기·끄기</h3><button data-act="reload-routines">새로 고침</button></div>
    <p class="note">켜진 부서는 정해진 시간에 일하고 여기에 보고해요. 실행마다 Claude 사용량이 들어요.</p>${head}<ul class="plain">${rows}</ul>`;
}

function postCard(d, x, i, svcId) {
  const p = d.posts;
  const cidn = channelId(x.channel);
  const ch = CHANNELS[cidn] ?? { name: x.channel };
  const url = withUtm(x.url ?? p.url, cidn, p.campaign);
  const text = stripLink(x.text, p.url);
  return `<article class="card"><div class="sec-head"><h3>${esc(ch.name)}</h3>${x.when ? `<span class="small muted">${esc(x.when)}</span>` : ''}</div>
    <pre class="post" id="post-${i}">${esc(ch.linkInComment ? text : text + '\n' + url)}</pre>
    ${ch.linkInComment ? `<p class="small">첫 댓글에 넣을 링크: <code id="link-${i}">${esc(url)}</code></p>` : ''}
    ${(x.note ?? ch.note) ? `<p class="small muted">${esc(x.note ?? ch.note)}</p>` : ''}
    <div class="row"><button data-act="copy" data-target="post-${i}">글 복사</button>
    ${ch.linkInComment ? `<button data-act="copy" data-target="link-${i}">링크 복사</button>` : ''}
    ${ch.intent ? `<a class="btn primary" href="${esc(ch.intent(text, url))}" target="_blank" rel="noopener">${esc(ch.name)}에 올리기</a>` : ''}
    ${canWrite ? `<button data-act="posted" data-svc="${esc(svcId)}" data-key="${esc(x.channel)}__${i}" data-channel="${esc(x.channel)}">올렸어요</button>` : ''}</div></article>`;
}

// ---- 부서 일정 (Claude Code Remote 커넥터)
function remoteError(e) {
  const c = e?.code;
  if (c === 'needs_reauth') return 'Claude Code Remote 연결이 끊겼어요. claude.ai 설정 → 커넥터에서 다시 연결해 주세요.';
  if (c === 'server_not_connected' || c === 'selection_required') return 'claude.ai 설정 → 커넥터에서 Claude Code Remote 를 추가하면 여기서 부서를 켜고 끌 수 있어요.';
  if (c === 'not_in_manifest') return '이 페이지에 부서 일정 권한을 허락하지 않았어요. 다시 열어 허락하면 쓸 수 있어요.';
  if (c === 'tool_error') return `부서 일정 처리 실패: ${e.message}`;
  if (c === 'server_unavailable') return '잠시 연결이 안 돼요. 조금 뒤 새로 고침을 눌러 주세요.';
  return '부서 일정을 불러오지 못했어요. 새로 고침을 눌러 주세요.';
}
async function loadRoutines() {
  if (!mcp) return;
  try {
    const r = await mcp.callTool(REMOTE, 'list_triggers', { limit: 100 }, { cache: false });
    S.routines = Array.isArray(r.payload?.data) ? r.payload.data : [];
    S.routinesErr = null;
  } catch (e) {
    S.routinesErr = remoteError(e);
  }
  render();
}
async function wake(svcId, dept, text) {
  const id = S.services.find((v) => v.id === svcId)?.routines?.[dept];
  if (!mcp || !id) return false;
  try {
    await mcp.callTool(REMOTE, 'fire_trigger', { trigger_id: id, text }, { cache: false });
    return true;
  } catch (e) {
    flash(remoteError(e));
    return false;
  }
}

// ---- 동작
const now = () => new Date().toISOString();
const P = (svc, path) => `companies/${svc}/${path}`;
async function act(el, ev) {
  const a = el.dataset.act;
  const svc = el.dataset.svc;
  if (a === 'copy') {
    const t = document.getElementById(el.dataset.target)?.textContent ?? '';
    try { await navigator.clipboard.writeText(t); el.textContent = '복사했어요'; }
    catch { const r = document.createRange(); r.selectNodeContents(document.getElementById(el.dataset.target)); getSelection().removeAllRanges(); getSelection().addRange(r); el.textContent = '선택됨 — 복사하세요'; }
    return;
  }
  if (a === 'reload-routines') { S.routines = null; render(); return loadRoutines(); }
  if (!db) return flash('이 화면에서는 저장할 수 없어요. claude.ai 에서 열어 주세요.');
  el.disabled = true;
  try {
    if (a === 'approve') {
      const ap = S.svc[svc].approvals.find((x) => x.id === el.dataset.id);
      await db.doc(P(svc, `approvals/${ap.id}`)).update({ status: 'approved', decidedAt: now() });
      const woke = await wake(svc, ap.dept, `대표 결재 승인: ${P(svc, 'approvals/' + ap.id)} "${ap.title}". 승인된 일을 진행하세요.`);
      flash(woke ? `승인했어요 — ${DEPT[ap.dept]?.name ?? ap.dept} 부서가 지금 진행해요` : '승인했어요 — 담당 부서가 다음 일할 때 진행해요');
    } else if (a === 'reject') {
      ev.preventDefault();
      const reason = new FormData(el).get('reason')?.toString().trim();
      if (!reason) { el.disabled = false; return flash('반려 이유를 한 줄 적어 주세요'); }
      await db.doc(P(svc, `approvals/${el.dataset.id}`)).update({ status: 'rejected', reason: reason.slice(0, 500), decidedAt: now() });
      flash('반려했어요 — 부서가 이유를 보고 고쳐요');
    } else if (a === 'human') {
      await db.doc(P(svc, `human/${el.dataset.id}`)).update({ done: true, doneAt: now() });
      flash('완료로 표시했어요');
    } else if (a === 'task') {
      ev.preventDefault();
      const f = new FormData(el);
      const title = f.get('title')?.toString().trim();
      if (!title) { el.disabled = false; return flash('무엇을 해야 하는지 적어 주세요'); }
      const dept = f.get('dept')?.toString();
      const ref = await db.collection(P(svc, 'tasks')).add({ title: title.slice(0, 200), detail: (f.get('detail') ?? '').toString().slice(0, 2000), dept, status: 'todo', by: 'ceo', createdAt: now(), updatedAt: now() });
      const woke = f.get('now') ? await wake(svc, dept, `대표가 새 일을 맡겼어요: ${P(svc, 'tasks/' + ref.id)} "${title}". 지금 처리하세요.`) : false;
      el.reset();
      flash(woke ? `${DEPT[dept].name} 부서가 지금 일을 시작해요` : `${DEPT[dept].name} 부서에 맡겼어요`);
    } else if (a === 'toggle') {
      const on = el.dataset.on === '1';
      const v = S.services.find((x) => x.id === svc);
      await mcp.callTool(REMOTE, 'update_trigger', { trigger_id: v.routines[el.dataset.dept], enabled: !on }, { cache: false });
      flash(`${DEPT[el.dataset.dept].name} 부서를 ${on ? '껐어요' : '켰어요'}`);
      await loadRoutines();
    } else if (a === 'run') {
      if (await wake(svc, el.dataset.dept, '대표가 지금 일하라고 했어요. 평소 루틴대로 처리하세요.')) flash(`${DEPT[el.dataset.dept].name} 부서가 지금 일을 시작해요. 몇 분 뒤 보고가 올라와요`);
      await loadRoutines();
    } else if (a === 'posted') {
      await db.doc(P(svc, `shared/${el.dataset.key}`)).set({ channel: el.dataset.channel, at: now() });
      flash('올린 것으로 기록했어요');
    }
  } catch (e) {
    const c = e?.code;
    flash(c === 'invalid_argument' ? '이 계정은 바꿀 권한이 없어요' : c ? remoteError(e) : '처리하지 못했어요. 잠시 후 다시 시도해 주세요');
  } finally {
    if (el.isConnected) el.disabled = false;
  }
}

document.addEventListener('click', (ev) => {
  if (ev.target.closest('a[data-noop], summary, details form')) return;
  const b = ev.target.closest('button[data-act]');
  if (b) { act(b, ev); return; }
  const g = ev.target.closest('[data-go]');
  if (g && !ev.target.closest('a, input, textarea, select')) {
    go(g.dataset.go || null);
    if (g.dataset.anchor) requestAnimationFrame(() => document.getElementById(g.dataset.anchor)?.scrollIntoView());
  }
});
document.addEventListener('submit', (ev) => { const f = ev.target.closest('form[data-act]'); if (f) { ev.preventDefault(); act(f, ev); } });
addEventListener('hashchange', () => { view = parseHash(); if (view.svc) loadExtra(view.svc); render(true); });

// ---- 데이터 연결: 서비스마다 운영에 필요한 5가지만 실시간으로
const sortDesc = (k) => (a, b) => String(b[k] ?? '').localeCompare(String(a[k] ?? ''));
const docs = (snap) => snap.docs.map((d) => ({ id: d.id, ...d.data() }));
function watch(id) {
  if (subs[id]) return;
  S.svc[id] = blank();
  const d = S.svc[id];
  const list = (subs[id] = []);
  const on = (ref, fn) => list.push(ref.onSnapshot((x) => { fn(x); render(); }, onErr));
  on(db.collection(P(id, 'approvals')).orderBy('createdAt', 'desc').limit(40), (x) => (d.approvals = docs(x)));
  on(db.collection(P(id, 'human')), (x) => (d.human = docs(x).sort(sortDesc('createdAt'))));
  on(db.collection(P(id, 'reports')), (x) => (d.reports = Object.fromEntries(docs(x).map((r) => [r.id, r]))));
  on(db.doc(P(id, 'metrics/main')), (x) => (d.metrics = x.exists ? x.data() : null));
  on(db.collection(P(id, 'feedback')).orderBy('date', 'desc').limit(14), (x) => (d.feedback = docs(x)));
}
function loadExtra(id) {
  const d = S.svc[id];
  if (!db || !d || d.extra) return;
  d.extra = true;
  const on = (ref, fn) => subs[id].push(ref.onSnapshot((x) => { fn(x); render(); }, onErr));
  on(db.doc(P(id, 'plan/roadmap')), (x) => (d.plan = x.exists ? x.data() : null));
  on(db.doc(P(id, 'share/posts')), (x) => (d.posts = x.exists ? x.data() : null));
  on(db.collection(P(id, 'shared')), (x) => (d.shared = new Set(x.docs.map((y) => y.id))));
  on(db.collection(P(id, 'tasks')).orderBy('updatedAt', 'desc').limit(100), (x) => (d.tasks = docs(x)));
  if (mcp && !S.routines) loadRoutines();
}
function unwatch(id) {
  (subs[id] ?? []).forEach((u) => u());
  delete subs[id];
  delete S.svc[id];
}
const onErr = () => flash('일부 정보를 불러오지 못했어요. 새로 고침해 주세요');

render();
(async () => {
  if (typeof claude === 'undefined') { S.loaded = true; render(); return; }
  db = await claude.use('db');
  const user = await claude.use('user');
  mcp = await claude.use('mcp');
  if (user) { const w = await user.can?.('data.write'); canWrite = w !== false; }
  if (!db) { S.loaded = true; render(); return; }
  db.collection('companies').onSnapshot((snap) => {
    S.services = docs(snap).sort((a, b) => String(a.name ?? a.id).localeCompare(String(b.name ?? b.id), 'ko'));
    S.loaded = true;
    const ids = new Set(S.services.map((v) => v.id));
    Object.keys(subs).filter((id) => !ids.has(id)).forEach(unwatch);
    S.services.forEach((v) => watch(v.id));
    if (view.svc) loadExtra(view.svc);
    render();
  }, onErr);
})();
</script>
