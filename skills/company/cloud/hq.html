<title>Atelier 본부</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* 레이아웃: 위 상태 띠 → 탭 → 한 열 카드 목록 (휴대폰 우선, 넓으면 2열) */
:root{
  --bg:#f3f4f1;--surface:#ffffff;--sunk:#e9ebe6;--ink:#1c211f;--ink-2:#46504b;--muted:#5d6762;--line:#d6dad3;
  --accent:#1f5f8b;--on-accent:#ffffff;
  --good:#1d7a3a;--warn:#9a6300;--crit:#b3261e;--good-bg:#e3f1e6;--warn-bg:#f8edd6;--crit-bg:#f9e2df;
  --font:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;--r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141816;--surface:#1c211f;--sunk:#252b28;--ink:#ecefeb;--ink-2:#c7cec9;--muted:#9aa49f;--line:#343c38;
  --accent:#7ab3dd;--on-accent:#0c1a24;
  --good:#7fd08f;--warn:#f0bf5a;--crit:#ff8a80;--good-bg:#1d3324;--warn-bg:#3a2f16;--crit-bg:#3d1f1c;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141816;--surface:#1c211f;--sunk:#252b28;--ink:#ecefeb;--ink-2:#c7cec9;--muted:#9aa49f;--line:#343c38;
  --accent:#7ab3dd;--on-accent:#0c1a24;
  --good:#7fd08f;--warn:#f0bf5a;--crit:#ff8a80;--good-bg:#1d3324;--warn-bg:#3a2f16;--crit-bg:#3d1f1c;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--font);margin:0}
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--line);padding-block:16px;padding-inline:12px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.side-head{margin:0;padding-inline:4px;font-weight:700;font-size:13px;letter-spacing:.04em;color:var(--muted)}
.side-note{margin:auto 4px 0}
.wrap{min-width:0;max-width:1000px;width:100%;padding-inline:24px;padding-block:12px 48px}
@media (max-width:759px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding-block:10px}
  .side-note{display:none}
  .wrap{padding-inline:16px}
}
h1,h2,h3{text-wrap:balance;margin:0}
h1{font-size:22px}h2{font-size:17px}h3{font-size:15px}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-block:8px}
.brand small{display:block;color:var(--muted);font-size:13px}
.state{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;padding:14px 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);margin-block:8px 12px}
.state[data-level="good"]{background:var(--good-bg);border-color:transparent}
.state[data-level="warning"]{background:var(--warn-bg);border-color:transparent}
.state[data-level="critical"]{background:var(--crit-bg);border-color:transparent}
.state strong{font-size:16px}
nav.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:16px}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;font:inherit;font-weight:500;color:var(--ink-2);cursor:pointer;white-space:nowrap;min-height:44px}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs .count{display:inline-block;min-width:20px;padding:0 6px;margin-left:4px;border-radius:10px;background:var(--crit);color:var(--surface);font-size:12px;font-family:var(--mono);text-align:center}
.grid{display:grid;gap:12px}
@media (min-width:760px){.grid.two{grid-template-columns:1fr 1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0;display:grid;gap:10px;align-content:start}
.sec{display:grid;gap:12px;margin-bottom:24px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.muted{color:var(--muted)}.small{font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:500;background:var(--sunk);color:var(--ink-2);white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)}.pill.warning{background:var(--warn-bg);color:var(--warn)}.pill.critical{background:var(--crit-bg);color:var(--crit)}
.pill.accent{background:var(--accent);color:var(--on-accent)}
button,.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:500;cursor:pointer;text-decoration:none}
button.primary,.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
button.danger{color:var(--crit);border-color:var(--crit)}
button:disabled{opacity:.55;cursor:not-allowed}
label{display:grid;gap:4px;font-weight:500;font-size:14px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:44px;width:100%}
textarea{min-height:88px}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:400}
.check input{width:22px;height:22px;min-height:0;margin-top:2px;accent-color:var(--accent);flex:none}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.kv div{background:var(--sunk);border-radius:8px;padding:10px 12px}
.kv b{display:block;font-family:var(--mono);font-size:20px;font-variant-numeric:tabular-nums}
pre.post{white-space:pre-wrap;word-break:break-all;margin:0;font:inherit;background:var(--sunk);border-radius:8px;padding:12px}
ul.plain{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.item{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item>div{min-width:0}
.empty{color:var(--muted);padding:12px;border:1px dashed var(--line);border-radius:8px}
.note{font-size:13px;color:var(--muted)}
.flash{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;max-width:calc(100% - 32px);z-index:5}
nav.svc{display:flex;flex-direction:column;gap:6px}
nav.svc button{display:grid;justify-items:start;justify-content:start;gap:0;min-height:56px;padding:8px 12px;text-align:left;border-radius:10px;border-color:transparent;background:transparent;width:100%}
nav.svc button:hover{background:var(--sunk)}
nav.svc button[aria-pressed="true"]{background:var(--sunk);border-color:var(--line);box-shadow:inset 3px 0 0 var(--accent)}
@media (max-width:759px){nav.svc{flex-direction:row;overflow-x:auto}nav.svc button{flex:none;width:auto;border-color:var(--line)}nav.svc button[aria-pressed="true"]{box-shadow:inset 0 -3px 0 var(--accent)}}
nav.svc .nm{font-weight:700}
nav.svc .meta{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);font-weight:400}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.dot.good{background:var(--good)}.dot.warning{background:var(--warn)}.dot.critical{background:var(--crit)}
details summary{cursor:pointer;color:var(--muted);font-size:13px}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}}
</style>

<div class="shell">
  <aside class="side" aria-label="내 서비스">
    <p class="side-head">Atelier 본부</p>
    <nav class="svc" id="svc-bar"></nav>
    <p class="note side-note">새 서비스는 Claude 에게 "새 서비스를 본부에 추가해 줘"라고 말하면 여기에 생겨요.</p>
  </aside>
  <div class="wrap">
    <header class="top">
      <div class="brand"><h1 id="co-name">본부</h1><small id="co-sub">AI 직원들이 일하고, 대표님은 결재만 해요</small></div>
      <a id="co-url" class="small" href="#" target="_blank" rel="noopener" hidden>서비스 열기 ↗</a>
    </header>
    <div class="state" id="state" data-level="idle" role="status"><strong id="state-title">불러오는 중</strong><span id="state-text" class="muted"></span></div>
    <nav class="tabs" role="tablist" aria-label="본부 메뉴">
      <button role="tab" data-tab="home" aria-selected="true">오늘</button>
      <button role="tab" data-tab="approvals">결재<span class="count" id="n-approvals" hidden></span></button>
      <button role="tab" data-tab="tasks">할 일</button>
      <button role="tab" data-tab="depts">부서</button>
      <button role="tab" data-tab="share">홍보</button>
      <button role="tab" data-tab="voice">사용자 의견<span class="count" id="n-voice" hidden></span></button>
    </nav>
    <main id="view"></main>
  </div>
</div>
<div class="flash" id="flash" role="status" hidden></div>

<script>
// ---- 회사 도메인 (Atelier company 스킬과 같은 부서 목록)
const DEPTS = [
  { id: 'ceo', name: '대표실', role: '하루 계획과 주간 보고' },
  { id: 'plan', name: '기획', role: '무엇을 만들지 정하고 명세' },
  { id: 'design', name: '디자인', role: '화면·이미지·아이콘' },
  { id: 'dev', name: '개발', role: '기능 구현·배포 준비' },
  { id: 'qa', name: 'QA', role: '품질 검사·사용성 테스트' },
  { id: 'security', name: '보안·법무', role: '보안 점검·약관' },
  { id: 'marketing', name: '마케팅', role: '홍보 글·채널 성과' },
  { id: 'support', name: '고객지원', role: '사용자 의견 정리·답변' },
  { id: 'ops', name: '운영', role: '서비스 상태·장애 대응' },
  { id: 'data', name: '데이터·재무', role: '지표·비용 보고' },
];
const DEPT = Object.fromEntries(DEPTS.map((d) => [d.id, d]));
const KIND = { good: '좋아요', hard: '불편해요', bug: '오류', idea: '제안' };
const LEVEL = { good: '정상', warning: '확인 필요', critical: '문제', idle: '기록 없음' };
const TASK_COLS = [['todo', '할 일'], ['doing', '진행 중'], ['review', '검토 중'], ['done', '완료']];
const REMOTE = 'Claude Code Remote';

// SNS 공식 공유 창 (Atelier share 스킬 channels.mjs 와 같은 규칙)
const enc = encodeURIComponent;
const CHANNELS = {
  x: { name: 'X (트위터)', intent: (t, u) => `https://x.com/intent/post?text=${enc(t)}&url=${enc(u)}` },
  threads: { name: 'Threads', intent: (t, u) => `https://www.threads.net/intent/post?text=${enc(t + '\n' + u)}` },
  bluesky: { name: 'Bluesky', intent: (t, u) => `https://bsky.app/intent/compose?text=${enc(t + '\n' + u)}` },
  facebook: { name: 'Facebook', intent: (_t, u) => `https://www.facebook.com/sharer/sharer.php?u=${enc(u)}`, note: '글은 복사해서 붙여 넣어요' },
  linkedin: { name: 'LinkedIn', intent: (_t, u) => `https://www.linkedin.com/sharing/share-offsite/?url=${enc(u)}`, note: '글은 복사해서 붙여 넣어요' },
  reddit: { name: 'Reddit', intent: (t, u) => `https://www.reddit.com/submit?url=${enc(u)}&title=${enc(t.split('\n')[0])}`, note: '게시판 규칙 먼저 확인' },
  band: { name: '네이버 밴드', intent: (t, u) => `https://band.us/plugin/share?body=${enc(t + '\n' + u)}&route=${enc(u)}` },
  naver_blog: { name: '네이버 블로그', intent: (t, u) => `https://share.naver.com/web/shareView?url=${enc(u)}&title=${enc(t.split('\n')[0])}` },
  kakaotalk: { name: '카카오톡', note: '복사해서 단톡·오픈채팅에 붙여 넣어요 (방 규칙 확인)' },
  everytime: { name: '에브리타임', note: '복사해서 홍보 게시판에 붙여 넣어요' },
  discord: { name: 'Discord', note: '복사해서 홍보 허용 채널에' },
  instagram: { name: 'Instagram', note: '링크는 프로필에, 이미지와 함께' },
};
const withUtm = (url, source, campaign) => {
  try {
    const u = new URL(url);
    u.searchParams.set('utm_source', source);
    u.searchParams.set('utm_medium', 'social');
    if (campaign) u.searchParams.set('utm_campaign', campaign);
    return u.href;
  } catch { return url; }
};

// ---- 상태
const S = { services: [], sums: {}, company: null, approvals: [], tasks: [], human: [], reports: {}, metrics: null, posts: null, shared: new Set(), feedback: [], routines: null, routinesErr: null, loaded: false };
let db = null, mcp = null, canWrite = true;
// 여러 서비스: 본부 하나에 companies/<서비스ID>/… 로 나눠 담는다. 고른 서비스는 이 브라우저에 기억.
let cid = null;
try { cid = localStorage.getItem('hq.service'); } catch {}
const P = (path) => `companies/${cid}/${path}`;
let tab = ['home', 'approvals', 'tasks', 'depts', 'share', 'voice'].includes(location.hash.slice(1)) ? location.hash.slice(1) : 'home';

const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const ago = (iso) => {
  if (!iso) return '기록 없음';
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  if (s < 90) return '방금';
  if (s < 3600) return `${Math.round(s / 60)}분 전`;
  if (s < 86400) return `${Math.round(s / 3600)}시간 전`;
  return `${Math.round(s / 86400)}일 전`;
};
const pill = (level, text) => `<span class="pill ${esc(level)}">${esc(text ?? LEVEL[level] ?? level)}</span>`;
function flash(msg) {
  const f = $('#flash');
  f.textContent = msg;
  f.hidden = false;
  clearTimeout(flash.t);
  flash.t = setTimeout(() => (f.hidden = true), 3200);
}

// 사람이 읽는 일정 (CRON_TZ=Asia/Seoul 분 시 * * 요일)
function schedule(cron) {
  const m = /^(?:CRON_TZ=\S+\s+)?(\d+)\s+(\d+)\s+\*\s+\*\s+(\S+)$/.exec(cron ?? '');
  if (!m) return cron ? '정해진 일정' : '일정 없음';
  const t = `${m[2].padStart(2, '0')}:${m[1].padStart(2, '0')}`;
  const d = { '*': '매일', '1-5': '평일' }[m[3]] ?? m[3].split(',').map((x) => '일월화수목금토'[Number(x) % 7] ?? x).join('·');
  return `${d} ${t}`;
}

// ---- 종합 상태
function overall() {
  const pend = S.approvals.filter((a) => a.status === 'pending').length;
  const todo = S.human.filter((h) => !h.done).length;
  const levels = Object.values(S.reports).map((r) => r.level);
  if (levels.includes('critical')) return ['critical', '확인이 필요한 문제가 있어요', '부서 보고에서 빨간 표시를 먼저 봐 주세요.'];
  if (pend) return ['warning', `결재 ${pend}건이 기다리고 있어요`, '결재 탭에서 승인하거나 이유를 적어 반려해 주세요.'];
  if (todo) return ['warning', `대표님 할 일 ${todo}개`, '오늘 탭 아래 목록에서 처리하고 체크해 주세요.'];
  if (levels.includes('warning')) return ['warning', '살펴볼 것이 있어요', '부서 보고의 노란 표시를 확인해 주세요.'];
  if (!S.loaded) return ['idle', '불러오는 중', ''];
  if (!S.services.length) return ['idle', '아직 등록된 서비스가 없어요', 'Claude 에게 "Atelier 로 새 서비스 본부에 추가해 줘"라고 말하면 여기에 생겨요.'];
  if (!levels.length) return ['idle', '아직 부서 보고가 없어요', '부서가 처음 일하면 여기에 오늘 상태가 나와요.'];
  return ['good', '오늘은 할 일이 없어요', 'AI 부서들이 알아서 일하고 있어요.'];
}

// ---- 화면
function render() {
  const c = S.company ?? {};
  document.title = 'Atelier 본부';
  $('#co-name').textContent = c.name ?? '본부';
  $('#co-sub').textContent = c.stage ? `지금 단계: ${c.stage}` : 'AI 직원들이 일하고, 대표님은 결재만 해요';
  renderServices();
  const link = $('#co-url');
  link.hidden = !c.url;
  if (c.url) link.href = c.url;
  const [lv, title, text] = overall();
  $('#state').dataset.level = lv;
  $('#state-title').textContent = title;
  $('#state-text').textContent = text;
  const pend = S.approvals.filter((a) => a.status === 'pending').length;
  $('#n-approvals').hidden = !pend;
  $('#n-approvals').textContent = pend;
  const newVoice = S.feedback.filter((f) => f.status !== 'triaged').length;
  $('#n-voice').hidden = !newVoice;
  $('#n-voice').textContent = newVoice;
  document.querySelectorAll('nav.tabs button').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.tab === tab)));
  $('#view').innerHTML = ({ home, approvals, tasks, depts, share, voice })[tab]();
}

function renderServices() {
  const bar = $('#svc-bar');
  if (!S.services.length) { bar.innerHTML = '<p class="note">아직 서비스가 없어요.</p>'; return; }
  bar.innerHTML = S.services.map((v) => {
    const m = S.sums[v.id] ?? {};
    const n = (m.pending ?? 0) + (m.todo ?? 0);
    return `<button data-svc="${esc(v.id)}" aria-pressed="${v.id === cid}"><span class="nm">${esc(v.name ?? v.id)}</span>
      <span class="meta"><span class="dot ${esc(m.level ?? '')}"></span>${n ? `대표 확인 ${n}건` : '확인할 것 없음'}</span></button>`;
  }).join('');
}

function approvalCard(a) {
  const d = DEPT[a.dept]?.name ?? a.dept;
  const decided = a.status !== 'pending';
  return `<article class="card" data-id="${esc(a.id)}">
    <div class="sec-head"><h3>${esc(a.title)}</h3>${decided ? pill(a.status === 'approved' ? 'good' : 'critical', a.status === 'approved' ? '승인함' : '반려함') : pill('warning', '결재 대기')}</div>
    <p class="small muted">${esc(d)} · ${esc(a.kind ?? '')}${a.cost ? ` · 비용 ${esc(a.cost)}` : ''} · ${ago(a.createdAt)}</p>
    ${a.detail ? `<p>${esc(a.detail)}</p>` : ''}
    ${a.ifApprove ? `<p class="small"><b>승인하면</b> ${esc(a.ifApprove)}</p>` : ''}
    ${a.ifReject ? `<p class="small"><b>반려하면</b> ${esc(a.ifReject)}</p>` : ''}
    ${decided ? (a.reason ? `<p class="small muted">반려 이유: ${esc(a.reason)}</p>` : '') : canWrite ? `
    <div class="row"><button class="primary" data-act="approve" data-id="${esc(a.id)}">승인</button>
    <details><summary>반려하기</summary><form data-act="reject" data-id="${esc(a.id)}" class="grid" style="margin-top:8px">
      <label for="why-${esc(a.id)}">반려 이유 (부서가 보고 고쳐요)</label><textarea id="why-${esc(a.id)}" name="reason" required maxlength="500"></textarea>

// ---- 부서 일정 (Claude Code Remote 커넥터)
function remoteError(e) {
  const c = e?.code;
  if (c === 'needs_reauth') return 'Claude Code Remote 연결이 끊겼어요. claude.ai 설정 → 커넥터에서 다시 연결해 주세요.';
  if (c === 'server_not_connected' || c === 'selection_required') return 'claude.ai 설정 → 커넥터에서 Claude Code Remote 를 추가하면 여기서 부서를 켜고 끌 수 있어요.';
  if (c === 'not_in_manifest') return '이 페이지에 부서 일정 권한을 허락하지 않았어요. 다시 열어 허락하면 쓸 수 있어요.';
  if (c === 'tool_error') return `부서 일정 처리 실패: ${e.message}`;
  if (c === 'server_unavailable') return '잠시 연결이 안 돼요. 조금 뒤 새로 고침을 눌러 주세요.';
  return '부서 일정을 불러오지 못했어요. 새로 고침을 눌러 주세요.';
}
async function loadRoutines() {
  if (!mcp) return;
  try {
    const r = await mcp.callTool(REMOTE, 'list_triggers', { limit: 100 }, { cache: false });
    const p = r.payload;
    S.routines = Array.isArray(p?.data) ? p.data : [];
    S.routinesErr = null;
  } catch (e) {
    S.routinesErr = remoteError(e);
  }
  render();
}
async function wake(dept, text) {
  const id = S.company?.routines?.[dept];
  if (!mcp || !id) return false;
  try {
    await mcp.callTool(REMOTE, 'fire_trigger', { trigger_id: id, text }, { cache: false });
    return true;
  } catch (e) {
    flash(remoteError(e));
    return false;
  }
}

// ---- 동작
const now = () => new Date().toISOString();
async function act(el, ev) {
  const a = el.dataset.act;
  if (a === 'copy') {
    const t = document.getElementById(el.dataset.target)?.textContent ?? '';
    try { await navigator.clipboard.writeText(t); el.textContent = '복사했어요'; }
    catch { const r = document.createRange(); r.selectNodeContents(document.getElementById(el.dataset.target)); getSelection().removeAllRanges(); getSelection().addRange(r); el.textContent = '선택됨 — 복사하세요'; }
    return;
  }
  if (a === 'reload-routines') { S.routines = null; render(); return loadRoutines(); }
  if (!db) return flash('이 화면에서는 저장할 수 없어요. claude.ai 에서 열어 주세요.');
  el.disabled = true;
  try {
    if (a === 'approve') {
      const ap = S.approvals.find((x) => x.id === el.dataset.id);
      await db.doc(P(`approvals/${ap.id}`)).update({ status: 'approved', decidedAt: now() });
      const woke = await wake(ap.dept, `대표 결재 승인: ${P('approvals/' + ap.id)} "${ap.title}". 승인된 일을 진행하세요.`);
      flash(woke ? '승인했어요. 담당 부서가 지금 진행해요' : '승인했어요. 담당 부서가 다음 일할 때 진행해요');
    } else if (a === 'reject') {
      ev.preventDefault();
      const reason = new FormData(el).get('reason')?.toString().trim();
      if (!reason) { el.disabled = false; return flash('반려 이유를 한 줄 적어 주세요'); }
      const ap = S.approvals.find((x) => x.id === el.dataset.id);
      await db.doc(P(`approvals/${ap.id}`)).update({ status: 'rejected', reason: reason.slice(0, 500), decidedAt: now() });
      flash('반려했어요. 부서가 이유를 보고 고쳐요');
    } else if (a === 'human') {
      await db.doc(P(`human/${el.dataset.id}`)).update({ done: true, doneAt: now() });
      flash('완료로 표시했어요');
    } else if (a === 'task') {
      ev.preventDefault();
      const f = new FormData(el);
      const title = f.get('title')?.toString().trim();
      if (!title) { el.disabled = false; return flash('무엇을 해야 하는지 적어 주세요'); }
      const dept = f.get('dept')?.toString();
      const ref = await db.collection(P('tasks')).add({ title: title.slice(0, 200), detail: (f.get('detail') ?? '').toString().slice(0, 2000), dept, status: 'todo', by: 'ceo', createdAt: now(), updatedAt: now() });
      const woke = f.get('now') ? await wake(dept, `대표가 새 일을 맡겼어요: ${P('tasks/' + ref.id)} "${title}". 지금 처리하세요.`) : false;
      el.reset();
      flash(woke ? `${DEPT[dept].name} 부서가 지금 일을 시작해요` : `${DEPT[dept].name} 부서에 맡겼어요`);
    } else if (a === 'toggle') {
      const on = el.dataset.on === '1';
      await mcp.callTool(REMOTE, 'update_trigger', { trigger_id: S.company.routines[el.dataset.dept], enabled: !on }, { cache: false });
      flash(`${DEPT[el.dataset.dept].name} 부서를 ${on ? '껐어요' : '켰어요'}`);
      await loadRoutines();
    } else if (a === 'run') {
      if (await wake(el.dataset.dept, '대표가 지금 일하라고 했어요. 평소 루틴대로 처리하세요.')) flash(`${DEPT[el.dataset.dept].name} 부서가 지금 일을 시작해요. 몇 분 뒤 보고가 올라와요`);
      await loadRoutines();
    } else if (a === 'posted') {
      await db.doc(P(`shared/${el.dataset.key}`)).set({ channel: el.dataset.channel, at: now() });
      flash('올린 것으로 기록했어요. 마케팅 부서가 채널별 반응을 비교해요');
    }
  } catch (e) {
    const c = e?.code;
    flash(c === 'invalid_argument' ? '이 계정은 바꿀 권한이 없어요' : c ? remoteError(e) : '처리하지 못했어요. 잠시 후 다시 시도해 주세요');
  } finally {
    if (el.isConnected) el.disabled = false;
    if (['approve', 'reject', 'human'].includes(a)) loadSums();
  }
}

document.addEventListener('click', (ev) => {
  const sv = ev.target.closest('button[data-svc]');
  if (sv) { select(sv.dataset.svc); return; }
  const t = ev.target.closest('[data-tab],[data-go]');
  if (t) {
    tab = t.dataset.tab ?? t.dataset.go;
    try { history.replaceState(null, '', '#' + tab); } catch {}
    render();
    if (tab === 'depts' && !S.routines) loadRoutines();
    return;
  }
  const b = ev.target.closest('button[data-act]');
  if (b) act(b, ev);
});
document.addEventListener('change', (ev) => { if (ev.target.matches('input[data-act="human"]') && ev.target.checked) act(ev.target, ev); });
document.addEventListener('submit', (ev) => { const f = ev.target.closest('form[data-act]'); if (f) { ev.preventDefault(); act(f, ev); } });

// ---- 데이터 연결
const sortDesc = (k) => (a, b) => String(b[k] ?? '').localeCompare(String(a[k] ?? ''));
const docs = (snap) => snap.docs.map((d) => ({ id: d.id, ...d.data() }));
let unsubs = [], attached = null;
function select(id) {
  unsubs.forEach((u) => u());
  unsubs = [];
  cid = id;
  attached = id;
  try { if (id) localStorage.setItem('hq.service', id); } catch {}
  Object.assign(S, { company: S.services.find((v) => v.id === id) ?? null, approvals: [], tasks: [], human: [], reports: {}, metrics: null, posts: null, shared: new Set(), feedback: [], routines: null, routinesErr: null });
  render();
  if (!id || !db) return;
  const on = (ref, fn) => unsubs.push(ref.onSnapshot((x) => { fn(x); render(); }, S.onErr));
  on(db.collection(P('approvals')).orderBy('createdAt', 'desc').limit(60), (x) => (S.approvals = docs(x)));
  on(db.collection(P('tasks')).orderBy('updatedAt', 'desc').limit(200), (x) => (S.tasks = docs(x)));
  on(db.collection(P('human')), (x) => (S.human = docs(x).sort(sortDesc('createdAt'))));
  on(db.collection(P('reports')), (x) => (S.reports = Object.fromEntries(docs(x).map((r) => [r.id, r]))));
  on(db.doc(P('metrics/main')), (d) => (S.metrics = d.exists ? d.data() : null));
  on(db.doc(P('share/posts')), (d) => (S.posts = d.exists ? d.data() : null));
  on(db.collection(P('shared')), (x) => (S.shared = new Set(x.docs.map((d) => d.id))));
  on(db.collection(P('feedback')).orderBy('date', 'desc').limit(30), (x) => (S.feedback = docs(x)));
  if (tab === 'depts') loadRoutines();
}
// 서비스 목록의 "대표 확인 n건" — 서비스마다 한 번씩 읽는다 (구독 수를 아끼려고)
async function loadSums() {
  if (!db) return;
  await Promise.all(S.services.map(async (v) => {
    try {
      const base = `companies/${v.id}`;
      const [ap, hu, re] = await Promise.all([
        db.collection(`${base}/approvals`).where('status', '==', 'pending').get(),
        db.collection(`${base}/human`).where('done', '==', false).get(),
        db.collection(`${base}/reports`).get(),
      ]);
      const lv = re.docs.map((d) => d.data().level);
      S.sums[v.id] = { pending: ap.size, todo: hu.size, level: lv.includes('critical') ? 'critical' : lv.includes('warning') || ap.size || hu.size ? 'warning' : lv.length ? 'good' : '' };
    } catch { /* 요약만 빠진다 */ }
  }));
  renderServices();
}

render();
(async () => {
  db = await claude.use('db');
  const user = await claude.use('user');
  mcp = await claude.use('mcp');
  if (user) { const w = await user.can?.('data.write'); canWrite = w !== false; }
  if (!db) { S.loaded = true; $('#state-title').textContent = 'claude.ai 에서 열어 주세요'; $('#state-text').textContent = '로그인한 상태에서만 회사 정보를 볼 수 있어요.'; return; }
  S.onErr = () => flash('일부 정보를 불러오지 못했어요. 새로 고침해 주세요');
  db.collection('companies').onSnapshot((snap) => {
    S.services = docs(snap).sort((a, b) => String(a.name ?? a.id).localeCompare(String(b.name ?? b.id), 'ko'));
    S.loaded = true;
    if (!S.services.some((v) => v.id === cid)) select(S.services[0]?.id ?? null);
    else if (attached !== cid) select(cid);
    else { S.company = S.services.find((v) => v.id === cid); render(); }
    loadSums();
  }, S.onErr);
})();
</script>
