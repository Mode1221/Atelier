# Atelier AI 회사 — 부서별 예약 실행
# 대표(사람)는 결재만. 부서는 GitHub Issues 로 일을 주고받는다.
# 필요: Secrets ANTHROPIC_API_KEY. 예산·실행 기록은 데이터 브랜치(atelier-data) — Atelier HQ "회사 세우기"가 만든다
name: Atelier company
on:
  schedule:
    - cron: "5 23 * * *"      # ceo       매일 08:05 KST
    - cron: "10 0 * * *"      # support   매일 09:10 KST
    - cron: "20 0 * * *"      # ops       매일 09:20 KST
    - cron: "30 0 * * *"      # qa        매일 09:30 KST
    - cron: "0 1 * * 1-5"     # dev       평일 10:00 KST
    - cron: "40 0 * * 1,3"    # plan      월·수
    - cron: "50 0 * * 2,4"    # design    화·목
    - cron: "0 2 * * 1,3,5"   # marketing 월·수·금
    - cron: "0 3 * * 5"       # security  금
    - cron: "30 1 * * 1"      # data      월
  workflow_dispatch:
    inputs:
      dept:
        description: "부서 (ceo plan design dev qa security marketing support ops data)"
        required: true
  issues:
    types: [labeled]
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read
jobs:
  route:
    runs-on: ubuntu-latest
    outputs:
      dept: ${{ steps.r.outputs.dept }}
    steps:
      - id: r
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT: ${{ inputs.dept }}
          LABEL: ${{ github.event.label.name }}
          LABELS: ${{ toJson(github.event.issue.labels.*.name) }}
        run: |
          dept=""
          case "$EVENT" in
            workflow_dispatch) dept="$INPUT" ;;
            pull_request) dept="qa" ;;
            issues)
              # 대표가 승인/반려하면 담당 부서를 바로 깨운다
              if [ "$LABEL" = "approved" ] || [ "$LABEL" = "rejected" ]; then
                dept=$(echo "$LABELS" | grep -o '"dept:[a-z]*"' | head -1 | tr -d '"' | cut -d: -f2)
              fi ;;
            schedule)
              case "$SCHEDULE" in
                "5 23 * * *") dept=ceo ;; "10 0 * * *") dept=support ;; "20 0 * * *") dept=ops ;;
                "30 0 * * *") dept=qa ;; "0 1 * * 1-5") dept=dev ;; "40 0 * * 1,3") dept=plan ;;
                "50 0 * * 2,4") dept=design ;; "0 2 * * 1,3,5") dept=marketing ;;
                "0 3 * * 5") dept=security ;; "30 1 * * 1") dept=data ;;
              esac ;;
          esac
          case "$dept" in ceo|plan|design|dev|qa|security|marketing|support|ops|data) ;; *) dept="" ;; esac
          echo "dept=$dept" >> "$GITHUB_OUTPUT"
          echo "부서: ${dept:-없음}"

  run:
    needs: route
    if: needs.route.outputs.dept != ''
    runs-on: ubuntu-latest
    concurrency: atelier-${{ needs.route.outputs.dept }}
    env:
      DEPT: ${{ needs.route.outputs.dept }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 50 }
      - name: 할 일 · 예산 확인
        id: gate
        run: |
          # 이슈 기반 부서는 할 일이 없으면 AI 를 부르지 않는다 (비용 절약)
          case "$DEPT" in
            plan|design|dev|security|marketing)
              n=$(gh issue list --label "dept:$DEPT" --state open --json number -q 'length')
              [ "$DEPT" = dev ] && n=$((n + $(gh issue list --label approved --label dept:dev --json number -q 'length')))
              if [ "$n" = 0 ] && [ "${{ github.event_name }}" = schedule ]; then echo "go=false" >> "$GITHUB_OUTPUT"; echo "할 일 없음 — 건너뜀"; exit 0; fi ;;
          esac
          # 예산: 데이터 브랜치(atelier-data)의 hq.json 과 이번 달 실행 기록(runs/YYYY-MM/부서__실행ID__비용__결과.json)
          month=$(date -u +%Y-%m)
          cfg=$(gh api "repos/$REPO/contents/hq.json?ref=atelier-data" --jq .content 2>/dev/null | base64 -d 2>/dev/null || echo '{}')
          budget=$(echo "$cfg" | jq -r --arg d "$DEPT" '.budgets[$d] // 10')
          paused=$(echo "$cfg" | jq -r --arg d "$DEPT" '(.paused // []) | index($d) != null')
          spent=$(gh api "repos/$REPO/git/trees/atelier-data?recursive=1" 2>/dev/null \
            | jq --arg p "runs/$month/${DEPT}__" '[.tree[]?.path | select(startswith($p)) | split("__")[2] | tonumber] | add // 0' 2>/dev/null || echo 0)
          echo "이번 달 $DEPT: \$$spent / 예산 \$$budget (쉬는 중: $paused)"
          if [ "$paused" = true ] || [ "$(echo "$spent >= $budget" | bc -l)" = 1 ]; then echo "go=false" >> "$GITHUB_OUTPUT"; echo "예산 초과 또는 쉬는 중 — 건너뜀"; exit 0; fi
          echo "go=true" >> "$GITHUB_OUTPUT"
      - name: 부서 업무
        id: claude
        if: steps.gate.outputs.go == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          plugin_marketplaces: https://github.com/Mode1221/Atelier-dev.git
          plugins: atelier-dev@atelier
          prompt: "/atelier-dev:company run ${{ env.DEPT }}"
          claude_args: >-
            --max-turns 60
            --allowedTools "Read,Glob,Grep,Edit,Write,Bash(gh:*),Bash(git:*),Bash(npm:*),Bash(npx:*),Bash(node:*),Bash(./scripts/*),WebSearch,WebFetch"
      - name: 실행 기록 (데이터 브랜치)
        if: always() && steps.gate.outputs.go == 'true'
        env:
          EXEC: ${{ steps.claude.outputs.execution_file }}
          OUTCOME: ${{ steps.claude.outcome }}
        run: |
          cost=0
          [ -n "$EXEC" ] && [ -f "$EXEC" ] && cost=$(jq '[.[] | select(.type=="result") | .total_cost_usd // 0] | add // 0' "$EXEC" 2>/dev/null || echo 0)
          cost=$(printf '%.4f' "$cost")
          # 파일 이름에 부서·실행ID·비용·결과를 담는다 → 동시에 여러 부서가 써도 충돌하지 않고, 목록만으로 합계를 낸다
          path="runs/$(date -u +%Y-%m)/${DEPT}__${{ github.run_id }}__${cost}__${OUTCOME:-unknown}.json"
          gh api -X PUT "repos/$REPO/contents/$path" -f message="chore: $DEPT 실행 기록" -f branch=atelier-data \
            -f content="$(printf '{"at":"%s"}' "$(date -u +%FT%TZ)" | base64 -w0)" >/dev/null || echo "::warning::실행 기록 저장 실패 (데이터 브랜치가 없으면 대시보드에서 회사 세우기를 다시 눌러 주세요)"
