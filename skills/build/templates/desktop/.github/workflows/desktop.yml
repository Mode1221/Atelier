# 데스크톱 앱 설치 파일 만들기 (윈도우 .msi/.exe · 맥 .dmg · 리눅스 .AppImage/.deb)
# 내 컴퓨터에 Rust 를 깔지 않아도 된다: 태그를 올리면 GitHub 이 세 운영체제에서 빌드해 Releases 초안에 붙인다.
#   git tag v0.1.0 && git push --tags   (Claude 가 대신 실행)
name: Desktop release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest
            args: --target universal-apple-darwin
          - os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: 리눅스 빌드 도구
        if: matrix.os == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev librsvg2-dev patchelf
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 코드 서명(선택, 유료 인증서): 없으면 윈도우 SmartScreen·맥 "확인되지 않은 개발자" 경고가 뜬다 — README 참고
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseDraft: true
          args: ${{ matrix.args }}
