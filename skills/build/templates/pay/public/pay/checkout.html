<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>결제</title>
<link rel="stylesheet" href="/pay/pay.css">
<!-- 토스페이먼츠 결제위젯 v2 (공식 SDK) -->
<script src="https://js.tosspayments.com/v2/standard"></script>
</head>
<body>
<main class="pay">
  <h1>결제</h1>
  <p class="muted" id="what">불러오는 중…</p>
  <div id="payment-method"></div>
  <div id="agreement"></div>
  <button class="btn" id="pay" disabled>결제하기</button>
  <p class="muted" id="sub-note" hidden>정기결제는 카드를 한 번 등록하면 기간마다 자동으로 결제돼요. 언제든 해지할 수 있어요.</p>
  <p class="muted" id="err" role="alert"></p>
</main>
<script>
// 사용: /pay/checkout.html?product=<plans.js 의 키>
const product = new URLSearchParams(location.search).get('product');
const $ = (id) => document.getElementById(id);
(async () => {
  const [cfg, list] = await Promise.all([fetch('/api/pay/config').then((r) => r.json()), fetch('/api/pay/products').then((r) => r.json())]);
  const p = list.find((x) => x.key === product);
  if (!p || !cfg.clientKey) { $('what').textContent = !p ? '없는 상품이에요.' : '결제 설정이 아직 안 됐어요 (운영자: TOSS_CLIENT_KEY).'; return; }
  $('what').textContent = `${p.name} · ${p.amount.toLocaleString('ko-KR')}원${p.kind === 'subscription' ? ` / ${p.period_days}일마다` : ''} (부가세 포함)`;
  const toss = TossPayments(cfg.clientKey);
  if (p.kind === 'subscription') {
    $('sub-note').hidden = false;
    $('pay').textContent = '카드 등록하고 구독 시작';
    $('pay').disabled = false;
    $('pay').onclick = () => toss.payment({ customerKey: cfg.customerKey }).requestBillingAuth({
      method: 'CARD',
      successUrl: `${location.origin}/pay/billing/success?product=${encodeURIComponent(p.key)}`,
      failUrl: `${location.origin}/pay/fail`,
    }).catch((e) => { $('err').textContent = e.message; });
    return;
  }
  const widgets = toss.widgets({ customerKey: cfg.customerKey });
  await widgets.setAmount({ currency: 'KRW', value: p.amount });
  await Promise.all([widgets.renderPaymentMethods({ selector: '#payment-method', variantKey: 'DEFAULT' }), widgets.renderAgreement({ selector: '#agreement', variantKey: 'AGREEMENT' })]);
  $('pay').disabled = false;
  $('pay').onclick = async () => {
    $('pay').disabled = true;
    try {
      // 주문은 서버가 만들고 금액도 서버가 정한다
      const o = await fetch('/api/pay/orders', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ product: p.key }) }).then((r) => r.json());
      if (o.error) throw new Error(o.error);
      await widgets.requestPayment({ orderId: o.orderId, orderName: o.orderName, successUrl: `${location.origin}/pay/success`, failUrl: `${location.origin}/pay/fail` });
    } catch (e) { $('err').textContent = e.message; $('pay').disabled = false; }
  };
})().catch((e) => { $('err').textContent = `결제 화면을 열지 못했어요: ${e.message}`; });
</script>
</body>
</html>
