<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>제주 3박 4일 정산</title>
<style>@font-face{font-family:'Pretendard';src:url('../package/dist/web/variable/woff2/PretendardVariable.woff2') format('woff2-variations');font-weight:45 920}
:root{--bg:#EEF1EE;--paper:#FFFFFF;--ink:#14212B;--ink-2:#55636E;--rule:#7C8A94;--hair:#D5DCD8;--send:#0B6E63;--on-send:#FFFFFF;--danger:#B3261E;--font:"Pretendard",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#0F171C;--paper:#172229;--ink:#E7EDEF;--ink-2:#9DAAB2;--rule:#6D7C86;--hair:#26343C;--send:#5CC3B4;--on-send:#0F171C}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--font);font-feature-settings:"tnum"}
main{max-width:480px;margin:0 auto;padding:20px 16px 32px}
h1{font-size:24px;line-height:1.25;margin:0}
.sub{color:var(--ink-2);margin:4px 0 20px;font-size:15px}
h2{font-size:17px;margin:28px 0 10px}
.ticket{background:var(--paper);border-radius:4px;padding:14px 16px 16px;position:relative;margin-bottom:10px}
.ticket::before{content:"";position:absolute;left:12px;right:12px;top:0;border-top:2px dashed var(--hair)}
.who{display:flex;gap:6px;align-items:baseline;font-size:15px;color:var(--ink-2);min-width:0}
.who b{color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:9.5em}
.amt{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:6px}
.amt strong{font-size:28px;font-weight:750;letter-spacing:-.01em}
.copy{min-height:44px;padding:0 14px;border-radius:8px;border:1.5px solid var(--send);background:transparent;color:var(--send);font:600 15px var(--font)}
.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--hair)}
.list li{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 0;border-bottom:1px solid var(--hair)}
.list .t{font-weight:600}.list .m{color:var(--ink-2);font-size:14px;grid-column:1}.list .a{grid-row:1/3;grid-column:2;align-self:center;font-weight:600}
.total{display:flex;justify-content:space-between;color:var(--ink-2);font-size:15px;padding:12px 0}
.total b{color:var(--ink)}
.actions{display:grid;gap:10px;margin-top:20px}
.primary{min-height:52px;border:0;border-radius:10px;background:var(--send);color:var(--on-send);font:650 17px var(--font)}
.quiet{min-height:48px;border:1.5px solid var(--rule);border-radius:10px;background:transparent;color:var(--ink);font:600 16px var(--font)}
button:focus-visible{outline:3px solid var(--send);outline-offset:2px}
</style></head><body><main>
<h1 id="t"></h1><p class="sub" id="sub"></p>
<h2>누가 누구에게 보내면 끝나요</h2><div id="tr"></div>
<h2>쓴 돈</h2><ul class="list" id="ex"></ul>
<div class="total"><span>합계</span><b id="total"></b></div>
<div class="actions"><button class="primary">정산 결과 단톡방에 보내기</button><button class="quiet">지출 추가</button></div>
</main>
<script src="../data.js"></script><script>
const T=TRIP,total=T.expenses.reduce((a,e)=>a+e.amount,0);
t.textContent=T.name+' 정산';sub.textContent=T.people.length+'명, 1인당 '+won(Math.round(total/T.people.length));
tr.innerHTML=T.transfers.map(x=>'<div class="ticket"><div class="who"><b title="'+x.from+'">'+x.from+'</b><span>님이</span><b>'+x.to+'</b><span>님에게</span></div><div class="amt"><strong>'+won(x.amount)+'</strong><button class="copy" aria-label="'+x.from+'님이 보낼 금액 '+won(x.amount)+' 복사">금액 복사</button></div></div>').join('');
ex.innerHTML=T.expenses.map(e=>'<li><span class="t">'+e.title+'</span><span class="m">'+e.by+'님이 내고 '+e.with+'명이 나눔</span><span class="a">'+won(e.amount)+'</span></li>').join('');
document.getElementById('total').textContent=won(total);
</script></body></html>
